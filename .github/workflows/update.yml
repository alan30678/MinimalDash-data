name: 更新測速資料

on:
  schedule:
    - cron: "17 19 * * *"   # 每天台灣時間 03:17
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下載警政署測速執法設置點
        run: |
          curl -fsSL --retry 3 -m 120 -o cameras.csv \
            "https://opdadm.moi.gov.tw/api/v1/no-auth/resource/api/dataset/EA5E6FCD-B82D-43B7-A5CF-E9893253187E/resource/110DAA6E-A012-44DC-8F84-891F2A6F0805/download"
      - name: 下載各縣市路口科技執法（目前：高雄市）
        # 抓不到不影響測速資料，只是這次沒有科技執法點
        run: |
          curl -fsSL --retry 3 -m 120 -o kcg.json             "https://openapi.kcg.gov.tw/Api/Service/Get/8cd64be2-4fbc-4690-9664-ccf20bd25cfc" || rm -f kcg.json
      - name: 轉換
        run: python3 tools/convert_cameras.py cameras.csv $(ls kcg.json 2>/dev/null) -o cameras.json
      - name: 有變動才提交
        run: |
          rm -f cameras.csv kcg.json
          git diff --quiet && exit 0
          # ponytail: 筆數太少視為來源出錯，不覆蓋（App 端也會再檢查一次）
          python3 -c "import json,sys; sys.exit(json.load(open('cameras.meta.json'))['count'] < 500)"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -am "更新測速資料 $(date +%F)"
          git push
